<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#23283e" />
    <script>
      (() => {
        let initialTheme = 'dark'
        try {
          if (localStorage.getItem('swing-theme') === 'light') initialTheme = 'light'
        } catch {}
        document.documentElement.dataset.theme = initialTheme
        document.querySelector('meta[name="theme-color"]').content = initialTheme === 'dark' ? '#23283e' : '#fcfcfc'
      })()
    </script>
    <meta
      name="description"
      content="숙명여자대학교 랩실막내들의 2026 SWING Silicon Valley Archive"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;family=Poppins:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <title>랩실막내들 | SWING Archive</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
