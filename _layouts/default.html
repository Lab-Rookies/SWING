<!doctype html>
<html lang="{{ site.lang | default: 'ko-KR' }}" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="{{ page.body_class | default: 'page' }}">
  {% include header.html %}
  <main id="main-content">
    {{ content }}
  </main>
  {% unless page.hide_footer %}
    {% include footer.html %}
  {% endunless %}
  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
</body>
</html>
