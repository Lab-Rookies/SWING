---
layout: default
---
<article class="interview-page">
  <section class="interview-hero">
    <div class="shell interview-hero-grid">
      <div>
        <p class="eyebrow">{{ page.eyebrow }}</p>
        <h1>{{ page.title }}</h1>
        <p class="interview-deck">{{ page.deck }}</p>
        <a class="text-link" href="{{ '/interview/' | relative_url }}">← Interview Archive</a>
      </div>
      <div class="portrait-frame">
        <img src="{{ page.image | relative_url }}" alt="{{ page.title }} 인터뷰 이미지">
      </div>
    </div>
  </section>

  <section class="page-content">
    <div class="shell prose-shell prose interview-copy">
      {{ content }}
    </div>
  </section>
</article>
