\
---
layout: default
---
<section class="page-hero">
  <div class="shell prose-shell">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="page-lead">{{ page.lead }}</p>{% endif %}
  </div>
</section>

<section class="page-content">
  <div class="shell prose-shell prose">
    {{ content }}
  </div>
</section>
